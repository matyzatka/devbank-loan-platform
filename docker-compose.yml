name: devbank

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-loan_platform}
      POSTGRES_USER: ${POSTGRES_USER:-loan_platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devbank_local_only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka-native:3.8.0
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:9093,PLAINTEXT://:19092,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG4J_ROOT_LOGLEVEL: WARN
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/19092'"]
      interval: 5s
      timeout: 5s
      retries: 12

  loan-api:
    build:
      context: ./backend
    image: devbank-backend:local
    ports:
      - "${API_PORT:-8080}:${SERVER_PORT:-8080}"
    environment: &backend-environment
      SERVER_PORT: ${SERVER_PORT:-8080}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-loan_platform}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-loan_platform}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-devbank_local_only}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      SPRING_KAFKA_CONSUMER_GROUP_ID: ${KAFKA_CONSUMER_GROUP_ID:-loan-platform-processing}
      KAFKA_TOPIC: ${KAFKA_TOPIC:-loan-application-events}
      LOAN_PLATFORM_API_ENABLED: "true"
      LOAN_PLATFORM_WORKER_ENABLED: "false"
      LOAN_PLATFORM_OUTBOX_PUBLISHER_ENABLED: "true"
      LOAN_PLATFORM_DEMO_DATA_ENABLED: ${LOAN_PLATFORM_DEMO_DATA_ENABLED:-true}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -c 'exec 3<>/dev/tcp/localhost/$${SERVER_PORT} &&
          printf "GET /actuator/health/readiness HTTP/1.0\r\n\r\n" >&3 &&
          read -r status <&3 && [[ "$$status" == *" 200 "* ]]'
      interval: 10s
      timeout: 3s
      retries: 12
    stop_grace_period: 30s

  processing-worker:
    build:
      context: ./backend
    image: devbank-backend:local
    environment:
      <<: *backend-environment
      SPRING_MAIN_WEB_APPLICATION_TYPE: none
      LOAN_PLATFORM_API_ENABLED: "false"
      LOAN_PLATFORM_WORKER_ENABLED: "true"
      LOAN_PLATFORM_OUTBOX_PUBLISHER_ENABLED: "false"
      LOAN_PLATFORM_DEMO_DATA_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      loan-api:
        condition: service_healthy
    stop_grace_period: 30s

  frontend:
    build:
      context: ./frontend
    image: devbank-frontend:local
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://loan-api:8080}
    depends_on:
      loan-api:
        condition: service_healthy
