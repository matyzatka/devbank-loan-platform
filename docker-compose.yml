services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: loan_platform
      POSTGRES_USER: loan_platform
      POSTGRES_PASSWORD: loan_platform
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loan_platform -d loan_platform"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka-native:3.8.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:9093,PLAINTEXT://:19092,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG4J_ROOT_LOGLEVEL: WARN
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/19092'"]
      interval: 5s
      timeout: 5s
      retries: 12

  loan-api:
    build:
      context: ./backend
    image: loan-platform-demo-backend
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/loan_platform
      DB_USERNAME: loan_platform
      DB_PASSWORD: loan_platform
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      LOAN_PLATFORM_API_ENABLED: "true"
      LOAN_PLATFORM_WORKER_ENABLED: "false"
      LOAN_PLATFORM_OUTBOX_PUBLISHER_ENABLED: "true"
      LOAN_PLATFORM_DEMO_DATA_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -c 'exec 3<>/dev/tcp/localhost/8080 &&
          printf "GET /actuator/health/readiness HTTP/1.0\r\n\r\n" >&3 &&
          read -r status <&3 && [[ "$$status" == *" 200 "* ]]'
      interval: 10s
      timeout: 3s
      retries: 10
    stop_grace_period: 30s

  processing-worker:
    image: loan-platform-demo-backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/loan_platform
      DB_USERNAME: loan_platform
      DB_PASSWORD: loan_platform
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      SPRING_MAIN_WEB_APPLICATION_TYPE: none
      LOAN_PLATFORM_API_ENABLED: "false"
      LOAN_PLATFORM_WORKER_ENABLED: "true"
      LOAN_PLATFORM_OUTBOX_PUBLISHER_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      loan-api:
        condition: service_healthy
    stop_grace_period: 30s

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:80"
    depends_on:
      loan-api:
        condition: service_healthy
