spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/loan_platform}
    username: ${DB_USERNAME:loan_platform}
    password: ${DB_PASSWORD:loan_platform}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Local defaults are intentionally isolated from the cloud-ready base configuration.
loan-platform:
  demo-data:
    enabled: ${LOAN_PLATFORM_DEMO_DATA_ENABLED:true}
