spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s
  application:
    name: loan-platform-backend
  jooq:
    sql-dialect: postgres
  flyway:
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:loan-platform-processing}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: record

loan-platform:
  api:
    enabled: true
  worker:
    enabled: false
  demo-data:
    enabled: false
  kafka:
    enabled: true
  events:
    topic: ${KAFKA_TOPIC:loan-application-events}
  outbox:
    publisher-enabled: true
    fixed-delay: 1000
    batch-size: 50

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

logging:
  pattern:
    correlation: "[requestId=%X{requestId:-}, applicationId=%X{applicationId:-}, eventId=%X{eventId:-}] "
  level:
    org.apache.kafka: WARN
    org.springframework.kafka: WARN
    org.jooq: WARN
    org.springdoc.core.events.SpringDocAppInitializer: ERROR
