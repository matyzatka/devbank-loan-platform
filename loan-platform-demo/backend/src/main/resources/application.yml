spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s
  application:
    name: loan-platform-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/loan_platform}
    username: ${DB_USERNAME:loan_platform}
    password: ${DB_PASSWORD:loan_platform}
  jooq:
    sql-dialect: postgres
  flyway:
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: loan-platform-audit
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: record

loan-platform:
  kafka:
    enabled: true
  events:
    topic: loan-application-events
  outbox:
    publisher-enabled: true
    fixed-delay: 1000
    batch-size: 50

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

server:
  shutdown: graceful

logging:
  level:
    org.apache.kafka: WARN
    org.springframework.kafka: WARN
    org.jooq: WARN
    org.springdoc.core.events.SpringDocAppInitializer: ERROR
