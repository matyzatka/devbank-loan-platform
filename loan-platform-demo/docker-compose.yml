services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: loan_platform
      POSTGRES_USER: loan_platform
      POSTGRES_PASSWORD: loan_platform
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loan_platform -d loan_platform"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/loan_platform
      DB_USERNAME: loan_platform
      DB_PASSWORD: loan_platform
    depends_on:
      postgres:
        condition: service_healthy
    # A Kafka-compatible broker will be added with the messaging milestone.
